<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1 {
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            font-style: italic;
        }
    </style>
</head>
<body>
    <script>
        var nome = window.prompt('Qual o seu nome')
        document.write(`<h1>Olá ${nome} Seu nome tem ${nome.length} letras</h1>`)
        document.write(`<h1>Seu nome em maaiúsculo: ${nome.toUpperCase()}</h1>`)
        document.write(`<h1>Seu nome em minuscula: ${nome.toLowerCase()}</h1>`)
    </script>
</body>
</html>
