<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <h1>Somando Valores</h1>
   <input type="number" name="n1" id="in1">
   <input type="number" name="n2" id="in2">
   <input type="button" value="Somar" onclick="somar()">
    <div id="res">
        Resultado dos valores
    </div>



   <script>
    function somar() {
        var s1 = document.getElementById('in1')
        var s2 = document.getElementById('in2')
        var ss1 = Number(s1.value)
        var ss2 = Number(s2.value)
        var soma = ss1 + ss2
        var res = document.getElementById('res')
        res.innerHTML = `A soma de ${ss1} + ${ss2} resulta em <strong>${soma}</strong>`
    }
   </script>
</body>
</html>
