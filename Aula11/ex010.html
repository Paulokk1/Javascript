<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Multas</title>
    <style>
        div#sur {
            width: 300px;
            height: 300px;
            
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
        }
    </style>
</head>
<body>
    <h1>Sistema de Multas</h1>
    Velocidade do carro: <input type="number" name="vel" id="ivel"> Km/h
    <input type="button" value="Verificar" onclick="multa()">
    <div id="res1">
    </div>
    <div id="res2"></div> 
    <script>
        function multa() {
            var txtmul = document.getElementById('ivel')
            var mul = Number(txtmul.value)
        var res = document.getElementById('res1')
        res.innerHTML = `Sua velocidade é ${mul}`
        if (mul > 60) {
            res2.innerHTML = `Você foi <strong>multado</strong>, dirija mais devagar`
        } 
        else {
            res2.innerHTML = `Você está na velocidade correta!`
        }         
    }
    </script>
    <h1>Qual o seu país</h1>
    <input type="text" name="txt" id="itxt">
    <input type="button" value="Verificar se é estrangeiro" onclick="clicar()">
    <div id="res"></div>
    <div id="sur"></div>
    <script>
        
        
        function clicar() {
            var txt = document.getElementById('itxt').value.trim()
            var res = document.getElementById('res')
            var sur = document.getElementById('sur')
            if (txt.toLowerCase() == 'brasil') {
                res.innerHTML = `Brasileiro`
                sur.style.backgroundImage = "url('feliz.jpg')"
            } else {
                res.innerHTML = `Estrangeiro`
                sur.style.backgroundImage = "url('therock.jpg')"
            }
            

        }

    </script>
</body>
</html>
